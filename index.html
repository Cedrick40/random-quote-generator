<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card" id="card">

    <h1>Random Quote Generator</h1>
    <p class="mood" id="mood">Mood</p>

    <figure class="quote-box">
      <blockquote>
        <p class="quote" id="quote" aria-live="polite"></p>
      </blockquote>
      <figcaption>&mdash; <span id="author"></span></figcaption>
    </figure>

    <div class="actions">
      <button type="button" id="new-quote" class="primary">New quote</button>
      <button type="button" id="share" class="secondary">Share</button>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

  </main>

  <script src="script.js"></script>
</body>
</html>
